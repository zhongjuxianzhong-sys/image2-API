name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Image2Studio.exe
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build executable
        shell: pwsh
        run: .\build.ps1

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\Image2Studio.exe"
          $guide = Resolve-Path "dist\使用说明.txt"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Missing dist\Image2Studio.exe"
          }
          if (-not (Test-Path -LiteralPath $guide)) {
            throw "Missing dist\使用说明.txt"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: Image2Studio-windows
          path: |
            dist/Image2Studio.exe
            dist/使用说明.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Image2Studio.exe
            dist/使用说明.txt
          generate_release_notes: true
