<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image2 生图工坊</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"></rect>
              <circle cx="8.5" cy="8.5" r="1.6"></circle>
              <path d="M21 15l-5-5L5 21"></path>
            </svg>
          </div>
          <div>
            <h1>Image2 生图工坊</h1>
            <p class="subtitle">自行填写中转站地址与 Key，自动发现并调用生图模型</p>
          </div>
        </div>
        <div class="status-chip" id="statusChip">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">正在检测配置…</span>
        </div>
      </header>

      <main class="workspace">
        <section class="panel composer" aria-label="生图参数">
          <div class="panel-head">
            <h2>提示词</h2>
            <button class="ghost-btn" id="clearPromptBtn" type="button">清空</button>
          </div>

          <label class="field">
            <span class="sr-only">图片提示词</span>
            <textarea id="promptBox" rows="6" placeholder="描述你想生成的画面，例如：高端当代人物肖像摄影，成年女性，极简室内背景，柔和的自然光，无文字、无水印…"></textarea>
          </label>

          <div class="ref-block">
            <div class="ref-head">
              <span class="field-label">参考图（可选，支持多张）</span>
              <button class="ghost-btn" type="button" id="clearReferenceBtn" hidden>清除</button>
            </div>
            <input class="ref-input" type="file" id="referenceInput" multiple accept="image/*" />
            <div class="reference-preview" id="referencePreview" hidden></div>
          </div>

          <div class="model-block">
            <div class="model-row">
              <label class="field">
                <span class="field-label">模型</span>
                <select id="modelSelect" disabled></select>
              </label>
              <button class="secondary-btn" type="button" id="refreshModelsBtn" disabled>刷新模型</button>
            </div>
            <p class="hint" id="modelHint">填写 API Key 与 Base URL 后自动获取可用生图模型。</p>
          </div>

          <div class="option-grid">
            <label class="field">
              <span class="field-label">画幅</span>
              <select id="ratioSelect"></select>
            </label>
            <label class="field" id="customRatioField" hidden>
              <span class="field-label">自定义比例</span>
              <input id="customRatioInput" type="text" inputmode="numeric" placeholder="例如 21:9" spellcheck="false" />
            </label>
            <label class="field">
              <span class="field-label">分辨率</span>
              <select id="kSelect"></select>
            </label>
            <label class="field" id="presetSizeField" hidden>
              <span class="field-label">尺寸</span>
              <select id="sizeSelect"></select>
            </label>
            <label class="field">
              <span class="field-label">质量</span>
              <select id="qualitySelect"></select>
            </label>
            <label class="field">
              <span class="field-label">数量</span>
              <div class="stepper">
                <button type="button" class="step-btn" data-step="-1" aria-label="减少数量">−</button>
                <input id="countInput" type="number" min="1" max="4" step="1" value="1" inputmode="numeric" />
                <button type="button" class="step-btn" data-step="1" aria-label="增加数量">+</button>
              </div>
            </label>
          </div>

          <div class="api-block">
            <label class="field">
              <span class="field-label">API Key（必填）</span>
              <div class="key-wrap">
                <input id="apiKeyInput" type="password" placeholder="粘贴你的中转站 API Key" spellcheck="false" autocomplete="off" />
                <button type="button" class="icon-btn key-toggle" id="keyToggle" aria-label="显示/隐藏 API Key">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </label>
            <label class="field">
              <span class="field-label">提供商地址（Base URL，必填）</span>
              <input id="baseUrlInput" type="url" placeholder="https://你的中转站地址/v1" spellcheck="false" autocomplete="off" />
            </label>
            <p class="hint" id="apiHint">程序不内置任何中转站与 key，首次使用请自行填写；两项仅随请求发送到后端用于调用中转站，不会写入日志。</p>
          </div>

          <div class="actions">
            <button class="primary-btn" id="generateBtn" type="button" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"></path>
              </svg>
              <span id="generateLabel">开始生成</span>
            </button>
          </div>

          <p class="hint" id="proxyHint">参考图、Key 与提供商地址仅随请求发送到后端用于调用中转站，不会写入日志。</p>
        </section>

        <section class="panel output" aria-label="生成结果">
          <div class="panel-head">
            <h2>生成结果</h2>
            <span class="output-count" id="outputCount"></span>
          </div>

          <div class="result-state" id="resultState">
            <div class="empty-art">
              <svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="8" y="8" width="32" height="32" rx="5"></rect>
                <circle cx="18" cy="18" r="3"></circle>
                <path d="M40 30l-8-8L16 38"></path>
              </svg>
            </div>
            <p class="state-title">还没有生图结果</p>
            <p class="state-sub">填写提示词，点击“开始生成”。</p>
          </div>

          <div class="loading" id="loading" hidden>
            <div class="spinner" aria-hidden="true"></div>
            <span id="loadingText">正在生成，通常需要 20~60 秒…</span>
          </div>

          <div class="grid" id="imageGrid"></div>
        </section>
      </main>

      <section class="panel history" id="historyPanel" hidden>
        <div class="panel-head">
          <h2>最近生成 <span class="history-count" id="historyCount"></span></h2>
          <button class="ghost-btn" id="clearHistoryBtn" type="button">清空历史</button>
        </div>
        <div class="history-grid" id="historyGrid"></div>
      </section>
    </div>

    <div class="modal" id="lightbox" hidden>
      <button class="modal-close" id="lightboxClose" type="button" aria-label="关闭">×</button>
      <img id="lightboxImg" alt="预览大图" />
    </div>

    <script src="app.js"></script>
  </body>
</html>
